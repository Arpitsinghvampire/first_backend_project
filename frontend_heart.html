<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HEART DISEASE PREDICTION MODEL</title>
	<link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>

	<form>
		<label>Enter your age </label>
		<input type="number" name="age" class = "age" min = "0" max = "120">

		<label>Your gender</label>
		<input type="radio" name="gender" value = "Male">Male

		<input type="radio" name="gender" value = "Female">Female

		<label>Glucose per mg per dl</label>
		<input type="number" name="glucose_mg_dl" class = "glucose" min = "1" max = "200">
		<label>Cholesterol per mg per dl</label>

		<input type="number" name="cholesterol_mg_dl" class = "cholesterol" min = "10" max = "500">
		<label>Systolic BP</label>

		<input type="number" name="systolic_bp" class = "bp" min = "10" max = "200">

		<label>Diastolic BP</label>
		<input type="number" name="diastolic_bp" class = "dias_bp" min = "10" max = "200">

		<label>BMI</label>
		<input type="number" name="bmi" class = "bmi" min = "10" max = "50">

		<label>Heart rate</label>

		<input type="number" name="heart_rate" class = "heart_rate" min = "10" max = "200">
		<label>Regular smoker</label>

		<input type="radio" name="smoking" value = "Yes">Yes

		<input type="radio" name="smoking" value = "No">No

		<label>Alcohol consumption</label>
		<input type="radio" name="alcohol_consumption" value = "Yes">Yes

		<input type="radio" name="alcohol_consumption" value = "No">No

		<label>Physical activity</label>
		<input type="radio" name="physical_activity" value = "Low">Low

		<input type="radio" name="physical_activity" value = "Medium">Medium

		<input type="radio" name="physical_activity" value = "High">High

		<label>Family History</label>
		<input type="radio" name="family_hist" value = "Yes">Yes

		<input type="radio" name="family_hist" value = "No">No




	</form>
</body>
</html>
